enable_cli: true

api_auth:
  - name: "llm_testing_token"
    token: "for_the_llm"
    scopes:
      - list
      - logs
      - get
      - health
      - start
    allowed_components:
      - sni5gect
      - sstorm
      - rtue
    pass_to:
      - sniffer_test_worker

build_spec:
  - component: "cueltschey/rt-env-test"
    branch: "main"
    pull: false


run_spec:
  - component: "cueltschey/rt-env-test"
    config_file: "configs/llm/test.yaml"
    name: "test"
    results_dir: "test"
    rf:
      type: "none"
