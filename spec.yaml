enable_cli: true

api_auth:
  - name: "llm.local"
    scopes:
      - list
      - logs
      - get
      - healthcheck
      - start
    allowed_components:
      - sni5gect
      - sstorm
    pass_to:
      - sniffer_test_worker

run_spec:
  - component: "llm_worker"
    name: "sniffer_test_worker"
    config_file: "configs/llm_worker/test.yaml"
    results_dir: ".rt_results"
    rf:
      type: "none"
