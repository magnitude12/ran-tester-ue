# Testing API authentication for control_api_check
exit_on_component_failure: true
api_auth:
  - name: "control_api_check_auth"
    token: "verification_token"
    scopes:
      - list
    allowed_components:
      - sni5gect
      - rtue
      - jammer
      - ssb-spoofer
    pass_to:
      - control_api_check

build_spec:
  - component: "cueltschey/rt-env-test"
    branch: "main"
    pull: false


run_spec:
  - component: "cueltschey/rt-env-test"
    config_file: "spec.yaml"
    name: "rf_device_check"
    args:
      - "--images-dir /usr/local/share/uhd"
      - "--check-env UHD_IMAGES_DIR=/usr/local/share/uhd"
      - "--check-usb"
    rf:
      type: "b200"

  - component: "cueltschey/rt-env-test"
    config_file: "spec.yaml"
    name: "volumes_check"
    args:
      - "--check-config /test.yaml"
      - "--check-env CONFIG=/test.yaml"
    rf:
      type: "none"

  - component: "cueltschey/rt-env-test"
    config_file: "spec.yaml"
    name: "influx_check"
    args:
      - "--check-env INFLUX_HOST=influxdb"
      - "--check-env INFLUX_PORT=8086"
      - "--check-env INFLUX_ORG=rtu"
      - "--check-env INFLUX_TOKEN"
      - "--check-influxdb"
      - "--influx-bucket rtusystem"
    rf:
      type: "none"

  - component: "cueltschey/rt-env-test"
    config_file: "spec.yaml"
    name: "control_api_check"
    args:
      - "--check-env CONTROL_HOST=controller"
      - "--check-env CONTROL_PORT=1343"
      - "--check-control-api"
    rf:
      type: "none"
