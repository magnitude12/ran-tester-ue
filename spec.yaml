enable_cli: true

build_spec:
  - component: "cueltschey/sni5gect-compact"
    branch: "iq_file"
    pull: false

  - component: "oran-testing/ssb-spoofer"
    branch: "autoconfiguration"
    pull: false

run_spec:
  - component: "cueltschey/sni5gect-compact"
    worker_thread: "sni5gect"
    name: "demo_sniffer_01"
    config_file: "configs/sni5gect/basic_file_test.yaml"
    rf:
      type: "none"

  - component: "oran-testing/ssb-spoofer"
    name: "demo_spoofer_01"
    config_file: "configs/ssb_spoofer/config_auto.yaml"
    rf:
      type: "none"
