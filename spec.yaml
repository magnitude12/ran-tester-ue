enable_cli: true

api_auth:
  - name: "llm_testing_token"
    token: "for_the_llm"
    scopes:
      - list
      - logs
      - get
      - health
      - start
    allowed_components:
      - sni5gect
      - sstorm
      - rtue
    pass_to:
      - sniffer_test_worker

run_spec:

  - component: "rtue"
    name: "rtue_uhd_001"
    config_file: "configs/srsran/ue_uhd.conf"
    rf:
      type: "b200"

  - component: "llm_worker"
    name: "sniffer_test_worker"
    config_file: "configs/llm_worker/test.yaml"
    results_dir: "sniffer_test"
    rf:
      type: "none"
