[rf]
tx_gain = 30
freq_offset = 0

nof_antennas = 1

srate = 11.52e6

device_name = uhd
device_args = type=b200,clock=external,num_recv_frames=1024,None

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
nof_carriers = 1
bands = 3

[pcap]
enable = none
mac_filename = /tmp/srsue.pcap
mac_nr_filename = /tmp/srsue.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = off
all_hex_limit = 32
filename = /tmp/srsue.log
file_max_size = -1
nas_level = info


[usim]
mode = soft
algo = milenage
opc  = 000102030405060708090A0B0C0D0E0F
k    = 00112233445566778899AABBCCDDEEFF
imsi = 001010000000001
imei = 001010000000001


[rrc]
release = 300
ue_category = 4
mbms_service_id = -1

[nas]
apn = internet

[phy]

[sim]
airplane_t_on_ms  = -1
airplane_t_off_ms = -1

[general]
metrics_csv_enable  = true
metrics_csv_filename = /tmp/srsue_metrics.csv
