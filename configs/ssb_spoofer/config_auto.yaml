# SSB Spoofer Configuration

enable_autoconfigure: true

# --------------------------------------------------------
# Database Configuration (used for automatic RF setup)
# --------------------------------------------------------
database:
  host: "0.0.0.0"
  port: 8086
  org: "rtu"
  token: "605bc59413b7d5457d181ccf20f9fda15693f81b068d70396cc183081b264f3b"
  bucket: "rtusystem"
  data_id: "test"


# --------------------------------------------------------
# RF Configuration
# --------------------------------------------------------
rf:
  device_name: "uhd"
  device_args: "type=b200"

  # These can be auto-configured from InfluxDB ChannelConfig
  #rx_freq_hz: 1842050000
  #tx_freq_hz: 1842050000

  srate_hz: 23040000

  #rx_gain_db: 40.0
  #tx_gain_db: 60.0


# --------------------------------------------------------
# SSB Configuration
# --------------------------------------------------------
ssb:
  # pattern auto-detected from band_report
  #pattern: "A"

  #scs_khz: 15

  periodicity_ms: 10

  #ssb_freq_offset_hz: 0

  beta_pss: 1.0
  beta_sss: 1.0
  beta_pbch: 1.0
  beta_pbch_dmrs: 1.0


# --------------------------------------------------------
# Attack Configuration
# --------------------------------------------------------
attack:
  target_pci: 1
  scan_for_target: true

  modify_cell_barred: true
  cell_barred_value: true

  modify_coreset0_idx: false
  coreset0_idx_value: 15

  modify_ss0_idx: true
  ss0_idx_value: 15

  modify_intra_freq_resel: false
  intra_freq_resel_value: false

  tx_power_offset_db: 0.0
  continuous_tx: true

  max_bursts: 0
  burst_interval_us: 9000
  burst_length_ms: 1


# --------------------------------------------------------
# Operational Parameters
# --------------------------------------------------------
operation:
  scan_duration_sec: 30.0
  log_level: "info"
  log_file: "ssb_spoofer.log"
  save_samples: false
  samples_file: "rx_samples.dat"
